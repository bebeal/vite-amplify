version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - corepack enable
        - yarn cache clean
        - yarn install
    build:
      commands:
        - yarn build
        - rm -f node_modules/@swc
        - rm -f node_modules/@esbuild
        - rm -f node_modules/@eslint
  artifacts:
      baseDirectory: .amplify-hosting
      files:
          - '**/*'
  cache:
    paths:
      - node_modules/**/*